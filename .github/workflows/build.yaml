name: Build aeric

# Every push and pull request: analyze + tests, then Android and iOS builds.
# Make the "test" job a required status check on main.
# Crash reporting is only compiled in when the repository secret SENTRY_DSN is set.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --platforms=android,ios --org com.nevbie --project-name aeric .
          python3 tool/patch_platforms.py
          dart run flutter_launcher_icons
      - name: Build APK
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: flutter build apk --release --dart-define=SENTRY_DSN="$SENTRY_DSN"
      - uses: actions/upload-artifact@v4
        with:
          name: aeric-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --platforms=android,ios --org com.nevbie --project-name aeric .
          python3 tool/patch_platforms.py
          dart run flutter_launcher_icons
      # Unsigned build to prove the iOS target compiles; signing/TestFlight needs an Apple developer account.
      - run: flutter build ios --release --no-codesign
