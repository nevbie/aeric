name: aeric
description: "aeric – paragliding planner: flyable sites and live thermal estimates from forecast and historical weather."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  geolocator: ^14.1.1
  sensors_plus: ^7.1.1
  flutter_pcm_sound: ^3.3.3
  wakelock_plus: ">=1.2.10 <1.8.1"
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  archive: ^4.3.0
  flutter_tts: ^4.2.5
  universal_ble: ^2.3.0
  mobile_scanner: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

# App icon (orange sky, sun, paraglider with a heart "E"). Source: assets/icon/aeric_icon.svg.
# Generated into the platform folders in CI: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FB8C00"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
